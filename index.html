  --font:'Huninn','Chiron GoRound TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
  --sticker:0 0 0 2px var(--line), 0 0 0 5px #fffdf5, 0 7px 0 5px rgba(122,82,48,.22);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--font); font-synthesis:none; color:var(--ink);
  background:var(--paper-2); line-height:1.65; font-size:16px;
}
[hidden]{display:none!important}
button{font:inherit; color:inherit; cursor:pointer}
h1,h2,h3,p,ul{margin:0}
ul{padding:0; list-style:none}
:focus-visible{outline:3px solid var(--ink); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

svg.i{width:1.15em; height:1.15em; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none}


.sheet{
  position:relative; min-height:100dvh; display:flex; flex-direction:column;
  background-color:var(--paper);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .48 0 0 0 0 .32 0 0 0 0 .19 0 0 0 .08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}
main{flex:1; padding-bottom:24px}
.view[hidden]{display:none}


.hero{
  position:relative; aspect-ratio:4/3; max-height:300px; width:100%;
  background:var(--hero) center 35%/cover;
  border-bottom:3px solid var(--line); border-radius:0 0 34px 28px / 0 0 26px 32px;
}
.brand{
  position:absolute; z-index:2; top:calc(14px + env(safe-area-inset-top,0px)); left:16px;
  display:flex; align-items:center; gap:6px; padding:3px 14px 3px 10px;
  background:var(--wood); border-radius:12px; box-shadow:var(--sticker); font-size:16px;
}
.locate{
  position:absolute; z-index:2; top:calc(14px + env(safe-area-inset-top,0px)); right:16px; width:42px; height:42px;
  display:grid; place-items:center; background:var(--wood); border:0; border-radius:50%; box-shadow:var(--sticker);
}
.locate:active{transform:translateY(2px)}

.say{display:flex; gap:12px; padding:0 16px; margin-top:-32px; position:relative; align-items:flex-start}
.avatar{width:64px; height:64px; border-radius:50%; background:var(--avatar) center/cover; box-shadow:var(--sticker); flex:none}
.bubble{
  position:relative; flex:1; min-width:0; margin-top:42px; padding:10px 14px 12px;
  background:#fff; border:2px solid var(--line); border-radius:8px 22px 22px 24px; box-shadow:0 4px 0 rgba(122,82,48,.22);
}
.bubble::before{
  content:""; position:absolute; left:-9px; top:12px; width:14px; height:14px; background:#fff;
  border-left:2px solid var(--line); border-bottom:2px solid var(--line); transform:rotate(45deg);
}
.bubble p+p{margin-top:2px}
.bubble .soft{color:var(--ink-soft); font-size:14px}
.ctx{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px}
.ctx li{display:flex; align-items:center; gap:4px; padding:1px 10px; font-size:12.5px; background:var(--paper); border:1.5px dashed var(--line); border-radius:999px}

.nudge{
  display:flex; align-items:center; gap:8px; width:calc(100% - 32px); margin:18px 16px 0; padding:8px 12px; text-align:left;
  background:var(--amber-bg); border:2px dashed var(--line); border-radius:14px; font-size:14px;
}
.nudge span{flex:1}


.tabs{display:grid; grid-template-columns:repeat(6,1fr); gap:7px; padding:20px 14px 6px}
.tab{
  position:relative; display:flex; flex-direction:column; align-items:center; padding:8px 0 5px; line-height:1;
  background:
    repeating-linear-gradient(90deg, rgba(122,82,48,.08) 0 2px, transparent 2px 9px),
    linear-gradient(#E9C793,#D6A868);
  border:2px solid var(--line); border-radius:10px 10px 7px 7px; box-shadow:0 4px 0 rgba(122,82,48,.4);
}
.tab:nth-child(odd){transform:rotate(-1deg)}
.tab:nth-child(even){transform:rotate(1deg)}
.tab b{font-weight:400; font-size:24px; color:#4A3220}
.tab small{margin-top:5px; font-size:12px; color:#5C4630}
.tab::before,.tab::after{content:""; position:absolute; top:5px; width:4px; height:4px; border-radius:50%; background:rgba(74,50,32,.55)}
.tab::before{left:5px} .tab::after{right:5px}
.tab[aria-selected="true"]{
  background:
    repeating-linear-gradient(90deg, rgba(43,90,34,.08) 0 2px, transparent 2px 9px),
    linear-gradient(#B4DB8A,#8FC260);
  transform:translateY(3px) rotate(0); box-shadow:0 1px 0 rgba(122,82,48,.4);
}
.tab[data-empty="true"]:not([aria-selected="true"]){opacity:.62}


.panel{padding:14px 16px 0}
.panel-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; margin-bottom:12px}
.panel-head h2{font-size:24px; font-weight:400; line-height:1.3}
.panel-head p{font-size:13px; color:var(--ink-soft); text-align:right}
.list{display:grid; gap:18px}

.card{
  position:relative; padding:14px 14px 14px; background:var(--card);
  border:2px solid var(--line); border-radius:18px 22px 18px 24px; box-shadow:0 5px 0 rgba(122,82,48,.26);
}
.card:not(.gone){display:flex; flex-direction:column}
.card:not(.gone) .actions{margin-top:auto}
.card:not(.gone) .says{margin-bottom:14px}
.card h3{font-size:19px; font-weight:400; line-height:1.35; padding-right:70px}
.meta{display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; margin-top:6px}
.kind{display:flex; align-items:center; gap:7px; font-size:13.5px; color:var(--ink-soft)}
.dot{width:10px; height:10px; border-radius:50%; background:var(--acc); border:1.5px solid var(--line)}
.trail{
  display:inline-flex; align-items:center; gap:6px; padding:0 12px 0 9px; font-size:14px;
  background:color-mix(in srgb, var(--acc) 26%, #fff); border:1.5px solid var(--line); border-radius:999px;
}
.reason{margin-top:10px}
.basis{display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:8px; font-size:12.5px}
.basis>span{color:var(--ink-soft)}
.basis ul{display:contents}
.basis li{padding:0 9px; background:#fff; border:1.5px solid var(--moss); color:var(--moss-deep); border-radius:999px}
.warn{
  display:flex; gap:7px; align-items:flex-start; margin-top:10px; padding:6px 10px; font-size:13.5px;
  background:var(--amber-bg); border:1.5px dashed var(--line); border-radius:12px;
}
.warn .i{margin-top:.3em}
.says{display:flex; gap:9px; align-items:flex-start; margin-top:12px}
.says .avatar{width:34px; height:34px; box-shadow:0 0 0 2px var(--line), 0 0 0 4px #fffdf5}
.says p{
  position:relative; flex:1; padding:5px 12px; font-size:14px; background:var(--paper); border-radius:4px 16px 16px 16px;
}
.actions{display:grid; grid-template-columns:repeat(3,1fr); gap:8px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:44px; padding:6px 14px;
  border:2px solid var(--line); border-radius:14px; background:#fff; text-decoration:none; color:var(--ink);
  box-shadow:0 4px 0 rgba(122,82,48,.3); transition:transform .08s, box-shadow .08s;
}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(122,82,48,.3)}
.btn.go{grid-column:1/-1; background:var(--moss); border-color:var(--moss-deep); color:#fff; box-shadow:0 4px 0 var(--moss-deep); font-size:16px}
.btn.go:active{box-shadow:0 1px 0 var(--moss-deep)}
.btn.fb{font-size:14px; padding:6px 4px}
.btn.fb[aria-pressed="true"]{transform:translateY(3px); box-shadow:0 1px 0 rgba(122,82,48,.3)}
.btn.fb[data-fb="like"][aria-pressed="true"]{background:#FFD3C8}
.btn.fb[data-fb="dislike"][aria-pressed="true"]{background:#E6DFCF}
.btn.fb[data-fb="been"][aria-pressed="true"]{background:var(--mint)}
.btn.fb[data-fb="like"][aria-pressed="true"] .i{fill:#E5624B; stroke:#B8402D}
.stamp{
  position:absolute; top:12px; right:14px; padding:0 10px; transform:rotate(-8deg);
  color:var(--moss-deep); border:3px double var(--moss-deep); border-radius:8px; font-size:15px; opacity:.9; pointer-events:none;
}
.card.gone{padding:10px 14px; display:flex; align-items:center; gap:10px; border-style:dashed; box-shadow:none; background:transparent; color:var(--ink-soft); font-size:14px}
.card.gone p{flex:1}
.link{background:none; border:0; padding:6px 4px; color:var(--moss-deep); text-decoration:underline; text-underline-offset:3px}


.empty{display:grid; justify-items:center; gap:8px; padding:26px 20px 24px; text-align:center;
  background:rgba(255,252,243,.6); border:2px dashed var(--line); border-radius:24px}
.empty .pic{width:112px; height:142px; background:var(--char) center/cover; border-radius:22px; box-shadow:var(--sticker); transform:rotate(-3deg); margin-bottom:10px}
.empty .txt{display:grid; justify-items:center; gap:8px}
.empty h3{font-size:19px; font-weight:400}
.empty p{color:var(--ink-soft); font-size:14px; max-width:26em}
.empty .btn{margin-top:8px}


.loader{display:grid; justify-items:center; gap:10px; padding:40px 20px; text-align:center; color:var(--ink-soft)}
.compass{width:104px; height:104px}
.needle{transform-origin:50px 50px; animation:lost 3.4s ease-in-out infinite}
@keyframes lost{
  0%{transform:rotate(20deg)} 14%{transform:rotate(160deg)} 30%{transform:rotate(-70deg)} 46%{transform:rotate(250deg)}
  60%{transform:rotate(95deg)} 78%{transform:rotate(-150deg)} 100%{transform:rotate(20deg)}
}
@media (prefers-reduced-motion:reduce){ .needle{animation:none; transform:rotate(40deg)} .btn{transition:none} }



.pref-head{padding:22px 16px 6px}
.pref-head h2{font-size:26px; font-weight:400; line-height:1.3}
.pref-head p{margin-top:4px; color:var(--ink-soft); font-size:14px}
.status{display:flex; align-items:center; gap:8px; margin:12px 16px 4px; padding:8px 12px; font-size:14px; border:2px dashed var(--line); border-radius:14px; background:var(--amber-bg)}
.status[data-ok="true"]{background:#E4F3D3}
form{padding:8px 16px 0; display:grid; gap:14px}
details.group{background:var(--card); border:2px solid var(--line); border-radius:18px 22px 18px 22px; box-shadow:0 5px 0 rgba(122,82,48,.26); overflow:hidden}
details.group summary{
  display:flex; align-items:center; gap:12px; padding:10px 14px; cursor:pointer; list-style:none; font-size:18px;
  background:repeating-linear-gradient(90deg, rgba(122,82,48,.07) 0 2px, transparent 2px 9px), linear-gradient(#E9C793,#D6A868);
}
details.group summary::-webkit-details-marker{display:none}
.glyph{width:38px; height:38px; display:grid; place-items:center; border-radius:50%; background:var(--acc); border:2px solid var(--line); box-shadow:0 0 0 3px #fffdf5; font-size:20px; color:#3A2A1A}
.group summary .i{margin-left:auto; transition:transform .15s}
details.group[open] summary .i{transform:rotate(180deg)}
.fields{display:grid; gap:18px; padding:16px 14px 18px}
fieldset{border:0; margin:0; padding:0; min-width:0}
legend,.lbl{display:block; padding:0; margin-bottom:8px; font-size:15px}
.hint{color:var(--ink-soft); font-size:12.5px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{position:relative}
.chip input{position:absolute; inset:0; opacity:0; margin:0; cursor:pointer}
.chip span{display:inline-block; padding:3px 14px; background:#fff; border:2px solid var(--line); border-radius:999px; font-size:14.5px}
.chip input:checked+span{background:var(--leaf); border-color:var(--moss-deep)}
.chip input:checked+span::before{content:"✓ "}
.chip input:focus-visible+span{outline:3px solid var(--ink); outline-offset:2px}
.seg{display:grid; grid-auto-flow:column; grid-auto-columns:1fr; border:2px solid var(--line); border-radius:14px; overflow:hidden; background:#fff}
.seg .chip span{display:block; padding:6px 4px; border:0; border-radius:0; text-align:center}
.seg .chip+.chip span{border-left:2px solid var(--line)}
.range{display:flex; align-items:center; gap:12px}
.range input{flex:1; accent-color:var(--moss)}
.range output{min-width:5.5em; text-align:right; font-size:14px}
.text,textarea{
  width:100%; padding:8px 12px; font:inherit; color:var(--ink); background:#fff; border:2px solid var(--line); border-radius:12px;
}
textarea{resize:vertical; min-height:76px}
.save{position:sticky; bottom:calc(72px + env(safe-area-inset-bottom,0px)); margin:0 -16px; padding:22px 16px 10px; background:linear-gradient(rgba(251,243,223,0), var(--paper) 45%)}
.save .btn{width:100%; font-size:16px}
.btn.primary{background:var(--moss); border-color:var(--moss-deep); color:#fff; box-shadow:0 4px 0 var(--moss-deep)}
.btn.primary:active{box-shadow:0 1px 0 var(--moss-deep)}


.nav{
  position:sticky; bottom:0; z-index:5; order:3; display:grid; grid-template-columns:1fr 1fr; gap:10px;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(#E9C793,#D6A868); border-top:3px solid var(--line);
}
.nav button{
  display:flex; align-items:center; justify-content:center; gap:8px; min-height:46px; background:transparent; border:2px solid transparent; border-radius:14px; font-size:16px;
}
.nav button[aria-current="page"]{background:var(--card); border-color:var(--line); box-shadow:0 3px 0 rgba(122,82,48,.35)}
.toast{
  position:fixed; left:50%; bottom:calc(86px + env(safe-area-inset-bottom,0px)); z-index:10; display:flex; gap:10px; align-items:center;
  width:max-content; max-width:min(440px,calc(100vw - 32px)); padding:6px 16px 6px 8px; background:#fff; border:2px solid var(--line); border-radius:999px;
  box-shadow:0 5px 0 rgba(122,82,48,.3); font-size:14.5px; transform:translate(-50%,20px); opacity:0; pointer-events:none; transition:transform .2s, opacity .2s;
}
.toast.show{transform:translate(-50%,0); opacity:1}
.toast .avatar{width:34px; height:34px; box-shadow:0 0 0 2px var(--line)}
@media (prefers-reduced-motion:reduce){ .toast{transition:none} }

.topbar{display:contents}
.locate .loc-text{display:none}
.locate, .nav button{line-height:1}
svg.i{display:block}
.pref-pic{display:none}
@media (max-width:899px){
  body[data-view="pref"] .brand, body[data-view="pref"] .locate{display:none}
}
@media (min-width:620px){
  .list{grid-template-columns:repeat(2,minmax(0,1fr)); align-items:stretch}
  .list>li{display:flex}
  .list>li>.card{flex:1; width:100%}
}

@media (min-width:900px){
  .topbar{
    display:flex; align-items:center; gap:20px; position:sticky; top:0; z-index:6; padding:10px max(32px, calc((100% - 1116px) / 2));
    background:repeating-linear-gradient(90deg, rgba(122,82,48,.07) 0 2px, transparent 2px 9px), linear-gradient(#E9C793,#D6A868);
    border-bottom:3px solid var(--line); box-shadow:0 4px 0 rgba(122,82,48,.22);
  }
  .brand{position:static; padding:0; background:none; box-shadow:none; font-size:24px; gap:10px}
  .brand .i{width:1.3em; height:1.3em}
  .nav{position:static; order:0; display:flex; gap:8px; margin-left:auto; padding:0; background:none; border:0}
  .nav button{padding:0 26px}
  .locate{position:static; display:inline-flex; align-items:center; justify-content:center; width:auto; height:46px; padding:0 18px; gap:8px; border-radius:14px; background:var(--card); box-shadow:0 0 0 2px var(--line), 0 3px 0 2px rgba(122,82,48,.3)}
  .locate .loc-text{display:block}

  main{padding-bottom:56px}
  .home{display:grid; grid-template-columns:380px minmax(0,1fr); gap:44px; max-width:1180px; margin:0 auto; padding:32px 32px 0; align-items:start}
  .side{position:sticky; top:96px}
  .hero{max-height:none; border:3px solid var(--line); border-radius:30px; box-shadow:0 6px 0 rgba(122,82,48,.25)}
  .say{padding:0 8px}
  .nudge{width:100%; margin:20px 0 0}
  .tabs{padding:4px 0 8px; gap:12px}
  .tab{padding:12px 0 8px}
  .tab b{font-size:32px}
  .tab small{font-size:13px}
  .panel{padding:18px 0 0}
  .panel-head h2{font-size:28px}
  .list{gap:22px}
  .empty{display:flex; align-items:center; justify-content:center; gap:32px; padding:36px 32px; text-align:left}
  .empty .pic{margin:0; flex:none}
  .empty .txt{justify-items:start}
  .loader{padding:80px 20px}

  .pref-layout{display:grid; grid-template-columns:320px minmax(0,1fr); gap:44px; max-width:1180px; margin:0 auto; padding:32px 32px 0; align-items:start}
  .pref-side{position:sticky; top:96px}
  .pref-head{padding:0}
  .status{margin:16px 0 0}
  .pref-pic{display:block; width:220px; aspect-ratio:560/709; margin:28px auto 0; background:var(--char) center/cover; border-radius:26px; box-shadow:var(--sticker); transform:rotate(-3deg)}
  form{display:block; padding:0; column-count:2; column-gap:22px}
  details.group{break-inside:avoid; margin-bottom:22px}
  .save{column-span:all; bottom:16px; margin:0; padding:24px 0 8px}
  .toast{bottom:32px}
}
</style>

  {cat:'fun', fields:[
    {k:'activity', t:'chips', label:'喜歡的活動', opts:['電影','桌遊','運動','公園','KTV','夜市'], def:['電影','桌遊']},
    {k:'place', t:'seg', label:'場所', opts:['室內','都可以','戶外'], def:'室內'},
    {k:'people', t:'seg', label:'和誰去', opts:['獨自','都可以','多人'], def:'多人'},
  ]},
  {cat:'common', glyph:'通', title:'其他', color:'#E7DCC0', fields:[
    {k:'dislike', t:'text', label:'討厭的東西', ph:'例如：香菜、人擠人、要排很久的隊', def:''},
    {k:'tryNew', t:'area', label:'這個月想嘗試的新事物', ph:'例如：想找一間好逛的獨立書店', def:''},
  ]},
];


const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
const catOf = id => CATS.find(c => c.id === id);

const state = {
  tab:'food', data:null, coords:null,
  feedback: store.get('kapi_feedback', {}),
  prefs: store.get('kapi_prefs', null),
};


function say(lines, chips){
  $('#bubble').innerHTML = lines.map((l,i)=>`<p class="${i?'soft':''}">${l}</p>`).join('') +
    (chips ? `<ul class="ctx">${chips.map(c=>`<li><svg class="i"><use href="#i-${c.icon}"/></svg>${esc(c.text)}</li>`).join('')}</ul>` : '');
}
let toastTimer;
function toast(text){
  $('#toast-text').textContent = text;
  const t = $('#toast'); t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 2200);
}


function locate(){
  return new Promise(res => {
    const fallback = {lat:25.0330, lng:121.5654, mock:true};
    if(!('geolocation' in navigator)) return res(fallback);
    navigator.geolocation.getCurrentPosition(
      p => res({lat:p.coords.latitude, lng:p.coords.longitude, mock:false}),
      () => res(fallback),
      {timeout:6000, maximumAge:60000}
    );
  });
}
function timeInfo(){
  const d = new Date(), h = d.getHours();
  const part = h<6?'凌晨': h<11?'早上': h<14?'中午': h<18?'下午': '晚上';
  return {part, clock:`${String(h).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`, h};
}
function greetLine(){
  const h = timeInfo().h;
  if(h<6) return '這麼晚還沒睡呀？';
  if(h<11) return '早安～肚子咕嚕咕嚕了嗎？';
  if(h<14) return '中午了，先吃飯最重要。';
  if(h<18) return '下午了，來點小點心嗎？';
  return '晚上了～今天辛苦囉。';
}


async function fetchRecs(){
  if(!CONFIG.API_URL){ await sleep(1300); return MOCK; }
  const ti = timeInfo();
  const res = await fetch(CONFIG.API_URL, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'recommend', token:CONFIG.TOKEN, lat:state.coords.lat, lng:state.coords.lng, time:ti.clock, prefs:state.prefs})
  });
  return await res.json();
}
function sendFeedback(id, type){
  store.set('kapi_feedback', state.feedback);
  if(!CONFIG.API_URL) return;
  fetch(CONFIG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({action:'feedback', token:CONFIG.TOKEN, id, type})}).catch(()=>{});
}
const prefFresh = () => {
  if(!state.prefs || !state.prefs.savedAt) return false;
  const a = new Date(state.prefs.savedAt), b = new Date();
  return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth();
};


function loaderHTML(){
  return `<div class="loader" role="status">
    <svg class="compass" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" fill="#F4DCA8" stroke="#7A5230" stroke-width="4"/>
      <circle cx="50" cy="50" r="37" fill="#FFFCF3" stroke="#7A5230" stroke-width="2" stroke-dasharray="2 5" stroke-linecap="round"/>
      <g class="needle"><path d="M50 16 L57 50 L43 50 Z" fill="#E5624B" stroke="#7A5230" stroke-width="2" stroke-linejoin="round"/><path d="M50 84 L57 50 L43 50 Z" fill="#fff" stroke="#7A5230" stroke-width="2" stroke-linejoin="round"/></g>
      <circle cx="50" cy="50" r="4" fill="#7A5230"/>
    </svg>
    <p>指針轉不停……卡皮正在努力。<br>我不認路，但我認得你喜歡什麼。</p></div>`;
}

function renderTabs(){
  const el = $('#tabs'); el.hidden = false;
  el.innerHTML = CATS.map(c => {
    const n = (state.data.recs[c.id]||[]).length, sel = c.id===state.tab;
    return `<button class="tab" role="tab" id="tab-${c.id}" aria-selected="${sel}" aria-controls="panel" tabindex="${sel?0:-1}" data-id="${c.id}" data-empty="${n===0}">
      <b>${c.glyph}</b><small>${n}<span class="sr"> 個推薦，${c.title}</span></small></button>`;
  }).join('');
}

function cardHTML(it, cat){
  const fb = state.feedback[it.id];
  if(fb==='dislike'){
    return `<li><div class="card gone"><p>已避開「${esc(it.name)}」，之後會少推類似的。</p><button class="link" data-undo="${it.id}">復原</button></div></li>`;
  }
  const q = encodeURIComponent(it.name);
  const state_ = t => `aria-pressed="${fb===t}"`;
  return `<li><article class="card" style="--acc:${cat.color}">
    ${fb==='been' ? '<span class="stamp">去過了</span>' : ''}
    <h3>${esc(it.name)}</h3>
    <div class="meta"><p class="kind"><span class="dot" aria-hidden="true"></span>${esc(it.kind)}</p>
    <p class="trail"><svg class="i"><use href="#i-paw"/></svg>步行 ${it.walk} 分鐘・${it.m} 公尺</p></div>
    <p class="reason">${esc(it.reason)}</p>
    <div class="basis"><span>依據</span><ul>${it.basis.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>
    ${it.uncertain ? `<p class="warn"><svg class="i"><use href="#i-alert"/></svg>${esc(it.uncertain)}</p>` : ''}
    <div class="says"><div class="avatar" aria-hidden="true"></div><p>${esc(it.kapi)}</p></div>
    <div class="actions">
      <a class="btn go" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener"><svg class="i"><use href="#i-go"/></svg>交給地圖 App 導航</a>
      <button class="btn fb" data-fb="like" data-id="${it.id}" ${state_('like')}><svg class="i"><use href="#i-heart"/></svg>喜歡</button>
      <button class="btn fb" data-fb="dislike" data-id="${it.id}" ${state_('dislike')}><svg class="i"><use href="#i-x"/></svg>不喜歡</button>
      <button class="btn fb" data-fb="been" data-id="${it.id}" ${state_('been')}><svg class="i"><use href="#i-check"/></svg>去過了</button>
    </div>
  </article></li>`;
}

function renderPanel(){
  const cat = catOf(state.tab), items = state.data.recs[cat.id] || [];
  const p = $('#panel'); p.setAttribute('aria-labelledby', 'tab-'+cat.id);
  const head = `<div class="panel-head"><h2>${cat.title}</h2><p>${items.length ? `${items.length} 個適合你的地方` : '這一類先空著'}<br>最多 5 個，不硬推</p></div>`;
  if(!items.length){
    p.innerHTML = head + `<div class="empty"><div class="pic" role="img" aria-label="卡皮歪著頭，一臉困惑"></div>
      <div class="txt"><h3>附近沒有適合你的${cat.noun}</h3>
      <p>卡皮寧可空著，也不硬推。換個地方再打開看看，或調整這個月的偏好。</p>
      <button class="btn" id="go-pref">調整偏好</button></div></div>`;
    return;
  }
  p.innerHTML = head + `<ul class="list">${items.slice(0,5).map(it=>cardHTML(it,cat)).join('')}</ul>`;
}

function renderHome(){
  renderTabs(); renderPanel();
  const w = state.data.weather || {}, ti = timeInfo();
  const total = CATS.reduce((n,c)=>n+(state.data.recs[c.id]||[]).length, 0);
  say([
    greetLine(),
    `${total ? `附近有 ${total} 個你可能喜歡的地方` : '這附近好像沒有適合你的地方'}${w.rain ? '，下雨所以戶外的先不推。' : '。'}`
  ],[
    {icon:'pin', text: state.coords.mock ? '示範位置' : `${state.coords.lat.toFixed(3)}, ${state.coords.lng.toFixed(3)}`},
    {icon:'clock', text:`${ti.part} ${ti.clock}`},
    {icon: w.rain ? 'rain' : 'sun', text: w.text ? `${w.text} ${w.temp}°C` : '天氣未知'},
  ]);
  const nudge = $('#nudge');
  nudge.hidden = prefFresh();
  $('#nudge-text').textContent = state.prefs ? '這個月的偏好還沒更新，卡皮還在用舊資料。' : '還沒填過偏好表單，先告訴卡皮你喜歡什麼。';
}

async function boot(){
  $('#tabs').hidden = true; $('#nudge').hidden = true;
  $('#panel').innerHTML = loaderHTML();
  say(['我先看看你在哪裡……','（我自己常常搞不清楚我在哪）']);
  state.coords = await locate();
  say(['找到了！','我來翻翻你的偏好表。']);
  try{
    state.data = await fetchRecs();
  }catch(e){
    $('#panel').innerHTML = `<div class="empty"><div class="pic" role="img" aria-label="卡皮歪著頭，一臉困惑"></div><div class="txt"><h3>卡皮連不上伺服器</h3><p>請確認網路，或檢查 API_URL 是否填對。</p><button class="btn" id="retry">再試一次</button></div></div>`;
    say(['糟糕，我迷路了。']);
    return;
  }
  renderHome();
}


function fieldHTML(f, val){
  const id = 'f-'+f.k;
  if(f.t==='chips') return `<fieldset><legend>${f.label}</legend><div class="chips">${f.opts.map(o=>`<label class="chip"><input type="checkbox" name="${f.k}" value="${o}" ${val.includes(o)?'checked':''}><span>${o}</span></label>`).join('')}</div></fieldset>`;
  if(f.t==='seg') return `<fieldset><legend>${f.label}</legend><div class="seg">${f.opts.map(o=>`<label class="chip"><input type="radio" name="${f.k}" value="${o}" ${val===o?'checked':''}><span>${o}</span></label>`).join('')}</div></fieldset>`;
  if(f.t==='range') return `<div><label class="lbl" for="${id}">${f.label}</label><div class="range"><input type="range" id="${id}" name="${f.k}" min="${f.min}" max="${f.max}" step="${f.step}" value="${val}" data-fmt="${f.k}"><output for="${id}">${f.fmt(val)}</output></div></div>`;
  if(f.t==='text') return `<div><label class="lbl" for="${id}">${f.label}</label><input class="text" type="text" id="${id}" name="${f.k}" placeholder="${f.ph}" value="${esc(val)}"></div>`;
  return `<div><label class="lbl" for="${id}">${f.label}</label><textarea id="${id}" name="${f.k}" placeholder="${f.ph}">${esc(val)}</textarea></div>`;
}
const wide = window.matchMedia('(min-width:900px)');
function syncGroups(){
  const gs = [...document.querySelectorAll('details.group')];
  gs.forEach(d => wide.matches ? d.removeAttribute('name') : d.setAttribute('name','pref'));
  gs.forEach((d,i) => { d.open = wide.matches ? true : i===0; });
}
wide.addEventListener('change', syncGroups);
function renderPrefs(){
  const saved = (state.prefs && state.prefs.values) || {};
  $('#pref-form').innerHTML = FORM.map((g,i)=>{
    const c = catOf(g.cat) || g;
    const title = g.title || c.title;
    return `<details class="group" style="--acc:${c.color}">
      <summary><span class="glyph" aria-hidden="true">${c.glyph}</span>${title}<svg class="i"><use href="#i-chev"/></svg></summary>
      <div class="fields">${g.fields.map(f=>fieldHTML(f, f.k in saved ? saved[f.k] : f.def)).join('')}</div></details>`;
  }).join('') + `<div class="save"><button type="submit" class="btn primary">存好偏好，交給卡皮</button></div>`;
  syncGroups();
  renderPrefStatus();
}
function renderPrefStatus(){
  const s = $('#pref-status'), ok = prefFresh();
  s.dataset.ok = ok;
  const d = state.prefs && state.prefs.savedAt ? new Date(state.prefs.savedAt) : null;
  s.innerHTML = ok
    ? `<svg class="i"><use href="#i-check"/></svg>本月已更新（${d.getMonth()+1}/${d.getDate()}）`
    : `<svg class="i"><use href="#i-alert"/></svg>${d ? `上次更新是 ${d.getMonth()+1}/${d.getDate()}，這個月還沒更新` : '這個月還沒填，先填好再回去看推薦'}`;
}
function collectPrefs(form){
  const out = {};
  FORM.forEach(g=>g.fields.forEach(f=>{
    if(f.t==='chips') out[f.k] = [...form.querySelectorAll(`input[name="${f.k}"]:checked`)].map(i=>i.value);
    else if(f.t==='seg'){ const r = form.querySelector(`input[name="${f.k}"]:checked`); out[f.k] = r ? r.value : f.def; }
    else if(f.t==='range') out[f.k] = Number(form.elements[f.k].value);
    else out[f.k] = form.elements[f.k].value.trim();
  }));
  return out;
}


function show(view){
  const home = view==='home';
  document.body.dataset.view = view;
  $('#view-home').hidden = !home; $('#view-pref').hidden = home;
  $('#nav-home').setAttribute('aria-current', home ? 'page' : 'false');
  $('#nav-pref').setAttribute('aria-current', home ? 'false' : 'page');
  if(!home) renderPrefs();
  window.scrollTo({top:0});
}


document.addEventListener('click', e => {
  const t = e.target.closest('button, a'); if(!t) return;
  if(t.classList.contains('tab')){ state.tab = t.dataset.id; renderTabs(); renderPanel(); $('#'+t.id).focus(); return; }
  if(t.dataset.fb){
    const id = t.dataset.id, type = t.dataset.fb;
    state.feedback[id] = state.feedback[id]===type ? undefined : type;
    if(!state.feedback[id]) delete state.feedback[id];
    sendFeedback(id, state.feedback[id]||'clear');
    renderPanel();
    if(state.feedback[id]) toast({like:'記住囉，你喜歡這家～', dislike:'好，下次避開這種。', been:'蓋章！去過了。'}[type]);
    return;
  }
  if(t.dataset.undo){ delete state.feedback[t.dataset.undo]; sendFeedback(t.dataset.undo,'clear'); renderPanel(); return; }
  if(t.id==='go-pref' || t.id==='nudge' || t.id==='nav-pref') return show('pref');
  if(t.id==='nav-home') return show('home');
  if(t.id==='btn-relocate'){ show('home'); return boot(); }
  if(t.id==='retry') return boot();
});
$('#tabs').addEventListener('keydown', e => {
  if(!['ArrowLeft','ArrowRight'].includes(e.key)) return;
  const i = CATS.findIndex(c=>c.id===state.tab), n = (i + (e.key==='ArrowRight'?1:-1) + CATS.length) % CATS.length;
  state.tab = CATS[n].id; renderTabs(); renderPanel(); $('#tab-'+state.tab).focus();
});
$('#pref-form').addEventListener('input', e => {
  const r = e.target; if(r.type!=='range') return;
  const f = FORM.flatMap(g=>g.fields).find(x=>x.k===r.name);
  r.parentElement.querySelector('output').textContent = f.fmt(Number(r.value));
});
$('#pref-form').addEventListener('submit', e => {
  e.preventDefault();
  state.prefs = {savedAt:new Date().toISOString(), values:collectPrefs(e.target)};
  store.set('kapi_prefs', state.prefs);
  renderPrefStatus(); toast('偏好存好了，卡皮記住囉。');
  if(CONFIG.API_URL) fetch(CONFIG.API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action:'savePrefs', token:CONFIG.TOKEN, prefs:state.prefs})}).catch(()=>{});
});

boot();
</script>
</body>
</html>
